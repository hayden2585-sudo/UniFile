[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unifile-by-soniscorett"
version = "2.4.0"
description = "Universal Read-Only File Translator & Distortion Healer Connector for AI Models"
readme = "README.md"
authors = [{ name = "Soniscorett", email = "labs@soniscorett.ai" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "ai", "llm", "mcp", "model-context-protocol", "file-translator",
    "mojibake", "zalgo", "healer", "read-only", "soniscorett", "unifile"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=10.0.0",
    "ftfy>=6.2.0",
    "langdetect>=1.0.9",
    "httpx>=0.27.0",
    "httpcore>=1.0.0,<2.0.0",
    "reportlab>=4.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
unifile = "unifile.cli:run_cli"

[project.urls]
Homepage = "https://github.com/soniscorett/unifile"
Documentation = "https://github.com/soniscorett/unifile#readme"
Repository = "https://github.com/soniscorett/unifile.git"
