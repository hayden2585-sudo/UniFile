<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#10b981;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#ec4899;#06b6d4;#3b82f6" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="file-face" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="gold-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="glitch-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .iso-container {
        transform-origin: 100px 100px;
        animation: float 4s ease-in-out infinite;
      }
      .scanner-beam {
        animation: scan 3s ease-in-out infinite alternate;
      }
      .glitch-particle-1 {
        animation: chaosStream1 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .glitch-particle-2 {
        animation: chaosStream2 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.5s;
      }
      .glitch-particle-3 {
        animation: chaosStream3 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.1s;
      }
      .clear-particle-1 {
        animation: clarityStream1 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .clear-particle-2 {
        animation: clarityStream2 2.7s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 0.7s;
      }
      .clear-particle-3 {
        animation: clarityStream3 2.3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.3s;
      }
      .pulse-ring {
        animation: ringPulse 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
        transform-origin: 100px 100px;
      }
      .crest-s {
        animation: crestPulse 3s ease-in-out infinite alternate;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(0.8deg); }
      }
      @keyframes scan {
        0% { transform: translateY(-30px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(32px); opacity: 0.2; }
      }
      @keyframes ringPulse {
        0% { transform: scale(0.85); opacity: 0.6; }
        50% { transform: scale(1.05); opacity: 0.2; }
        100% { transform: scale(0.85); opacity: 0.6; }
      }
      @keyframes chaosStream1 {
        0% { transform: translate(-30px, -15px); opacity: 0; }
        30% { opacity: 1; }
        80% { opacity: 0.8; }
        100% { transform: translate(0px, 0px); opacity: 0; }
      }
      @keyframes chaosStream2 {
        0% { transform: translate(-35px, 12px); opacity: 0; }
        30% { opacity: 1; }
        80% { opacity: 0.8; }
        100% { transform: translate(0px, 0px); opacity: 0; }
      }
      @keyframes chaosStream3 {
        0% { transform: translate(-28px, -2px); opacity: 0; }
        30% { opacity: 1; }
        80% { opacity: 0.8; }
        100% { transform: translate(0px, 0px); opacity: 0; }
      }
      @keyframes clarityStream1 {
        0% { transform: translate(0px, 0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: translate(32px, -12px); opacity: 0; }
      }
      @keyframes clarityStream2 {
        0% { transform: translate(0px, 0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: translate(36px, 14px); opacity: 0; }
      }
      @keyframes clarityStream3 {
        0% { transform: translate(0px, 0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 0.9; }
        100% { transform: translate(30px, 2px); opacity: 0; }
      }
      @keyframes crestPulse {
        0% { filter: drop-shadow(0 0 4px #06b6d4); }
        100% { filter: drop-shadow(0 0 10px #8b5cf6); }
      }
    </style>
  </defs>

  <!-- Background Dark Disc -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-glow)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Pulsing Energy Ring -->
  <circle class="pulse-ring" cx="100" cy="100" r="78" fill="none" stroke="url(#prism-grad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Left: Chaotic Inbound Stream (Distorted, Glitched, Encrypted Symbols) -->
  <g id="chaos-stream">
    <g class="glitch-particle-1">
      <text x="35" y="78" font-family="monospace" font-size="10" font-weight="bold" fill="#f43f5e">Ã©#</text>
    </g>
    <g class="glitch-particle-2">
      <text x="25" y="112" font-family="monospace" font-size="9" font-weight="bold" fill="#ec4899">0x7F</text>
    </g>
    <g class="glitch-particle-3">
      <text x="32" y="98" font-family="monospace" font-size="9" fill="#c084fc">z̷a̷l̷</text>
    </g>
    <!-- Left ray -->
    <path d="M 30 100 Q 60 95 78 100" stroke="url(#glitch-stream)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" stroke-dasharray="4 3" />
  </g>

  <!-- Center: 3D Holographic Universal File Prism -->
  <g class="iso-container">
    <!-- Back Sheet Layer (Shadow/Depth) -->
    <path d="M 78 52 L 122 52 L 138 68 L 138 142 L 78 142 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.7" />

    <!-- Main Sheet (Folded Top-Right Corner) -->
    <path d="M 70 58 L 114 58 L 130 74 L 130 148 L 70 148 Z" fill="url(#file-face)" stroke="url(#prism-grad)" stroke-width="2" filter="url(#soft-glow)" />

    <!-- Folded Corner Flap -->
    <path d="M 114 58 L 114 74 L 130 74 Z" fill="#1e293b" stroke="url(#prism-grad)" stroke-width="1.5" />

    <!-- File Code / Text Lines -->
    <line x1="80" y1="82" x2="112" y2="82" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="80" y1="92" x2="120" y2="92" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <line x1="80" y1="102" x2="105" y2="102" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- Dynamic Holographic Scanner Beam Sweeping the File -->
    <g class="scanner-beam">
      <line x1="68" y1="100" x2="132" y2="100" stroke="#06b6d4" stroke-width="2" filter="url(#neon-glow)" />
      <polygon points="68,98 132,98 126,104 74,104" fill="url(#prism-grad)" opacity="0.35" />
    </g>

    <!-- Center Emblem: Soniscorett Pristine Hexagon & Stylized 'S' Core -->
    <g class="crest-s">
      <polygon points="100,105 116,114 116,132 100,141 84,132 84,114" fill="#030712" stroke="url(#prism-grad)" stroke-width="2" />
      <!-- Futuristic Stylized 'S' Monogram for Soniscorett -->
      <path d="M 106 117 C 104 115 97 114 94 118 C 91 122 104 123 103 129 C 102 134 94 135 91 133" fill="none" stroke="url(#gold-stream)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="100" cy="123" r="1.5" fill="#38bdf8" />
    </g>

    <!-- Holographic Corner Node Dots -->
    <circle cx="70" cy="58" r="2.5" fill="#06b6d4" />
    <circle cx="130" cy="74" r="2.5" fill="#8b5cf6" />
    <circle cx="130" cy="148" r="2.5" fill="#10b981" />
    <circle cx="70" cy="148" r="2.5" fill="#3b82f6" />
  </g>

  <!-- Right: Pristine Coherent Stream (Golden-Emerald Clean Output & 80%+ Badge) -->
  <g id="clarity-stream">
    <!-- Right ray -->
    <path d="M 122 100 Q 145 105 170 100" stroke="url(#gold-stream)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" filter="url(#neon-glow)" />
    
    <g class="clear-particle-1">
      <text x="142" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34d399">文</text>
    </g>
    <g class="clear-particle-2">
      <text x="145" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">80%+</text>
    </g>
    <g class="clear-particle-3">
      <text x="146" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">✓</text>
    </g>
  </g>

  <!-- Bottom Brand Text Monogram Badge -->
  <g transform="translate(100, 178)">
    <rect x="-56" y="-10" width="112" height="18" rx="9" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="3" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#94a3b8">
      SONISCORETT
    </text>
  </g>
</svg>
